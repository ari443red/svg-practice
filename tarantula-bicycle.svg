  <ellipse cx="296" cy="280" rx="20" ry="12" fill="#ffffff" opacity="0.14"/>

  <!-- waist -->
  <path d="M374 296 Q 382 310 374 324" stroke="#5a3a22" stroke-width="11" fill="none" stroke-linecap="round"/>

