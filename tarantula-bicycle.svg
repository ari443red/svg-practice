    <circle cx="451" cy="271" r="1.4"/>
    <circle cx="440" cy="281" r="1.2"/>
    <circle cx="450" cy="280" r="1"/>
  </g>

  <!-- pedipalps -->
  <g stroke="#6b4423" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
