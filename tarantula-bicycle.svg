<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8f0"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset="1" stop-color="#ffd93b"/>
    </radialGradient>
  </defs>

  <!-- sky & sun -->
  <rect x="0" y="0" width="900" height="650" fill="url(#sky)"/>
  <circle cx="760" cy="95" r="55" fill="url(#sun)"/>
  <ellipse cx="140" cy="90" rx="80" ry="26" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="330" cy="60" rx="55" ry="20" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="560" cy="120" rx="65" ry="22" fill="#ffffff" opacity="0.7"/>

  <!-- ground -->
  <rect x="0" y="520" width="900" height="130" fill="#82cd52"/>
  <path d="M0 520 Q 225 508 450 520 T 900 520" fill="none" stroke="#5aa030" stroke-width="4"/>
  <circle cx="90" cy="555" r="6" fill="#5aa030"/>
  <circle cx="700" cy="570" r="7" fill="#5aa030"/>
  <circle cx="820" cy="545" r="5" fill="#5aa030"/>

  <!-- ===== BICYCLE ===== -->
