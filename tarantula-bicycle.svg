  <ellipse cx="412" cy="300" rx="54" ry="48" fill="#7d5230" stroke="#3d2413" stroke-width="3"/>
  <g stroke="#b07a44" stroke-width="3.2" stroke-linecap="round" fill="none">
    <path d="M372 268 L 364 254"/>
    <path d="M392 256 L 388 242"/>
    <path d="M414 252 L 415 238"/>
    <path d="M436 258 L 444 245"/>
    <path d="M456 276 L 466 266"/>
    <path d="M464 300 L 477 300"/>
    <path d="M456 326 L 466 334"/>
    <path d="M396 346 L 392 359"/>
    <path d="M420 348 L 424 361"/>
    <path d="M374 328 L 364 336"/>
  </g>
  <ellipse cx="394" cy="276" rx="20" ry="12" fill="#ffffff" opacity="0.16"/>

  <!-- eye turret -->
  <ellipse cx="446" cy="276" rx="14" ry="10" fill="#5a3a22"/>
  <g fill="#ffe066">
