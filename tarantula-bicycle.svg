  <path d="M444 336 Q 440 356 430 360 Q 438 348 434 336 Z" fill="#2e1c10"/>
  <path d="M456 334 Q 458 354 466 358 Q 458 346 464 334 Z" fill="#2e1c10"/>

  <!-- front legs -->
  <g stroke="#7d5230" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M388 330 Q 335 372 292 412"/>
    <path d="M400 344 Q 352 404 332 452"/>
