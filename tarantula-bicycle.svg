    <path d="M435 292 Q 500 268 548 238"/>
  </g>
  <circle cx="558" cy="300" r="9" fill="#6b4423"/>
  <circle cx="550" cy="238" r="9" fill="#6b4423"/>
  <g stroke="#a06a35" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M492 316 L 490 304"/>
    <path d="M522 314 L 524 302"/>
    <path d="M492 280 L 490 268"/>
    <path d="M526 262 L 530 250"/>
