  <g stroke="#a06a35" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M268 275 L 256 262"/>
    <path d="M282 258 L 274 244"/>
    <path d="M304 248 L 300 234"/>
    <path d="M330 246 L 334 232"/>
    <path d="M356 256 L 366 244"/>
    <path d="M372 278 L 384 268"/>
    <path d="M378 304 L 391 300"/>
    <path d="M266 320 L 254 322"/>
    <path d="M270 344 L 258 352"/>
    <path d="M288 358 L 280 370"/>
    <path d="M314 364 L 312 378"/>
    <path d="M340 358 L 346 372"/>
    <path d="M362 344 L 372 354"/>
    <path d="M368 318 L 380 322"/>
  </g>
  <!-- pink toe setae patch (Chilean rose tarantula style) -->
  <path d="M300 320 Q 318 352 340 320 Q 320 336 300 320" fill="#e8879a" opacity="0.85"/>
