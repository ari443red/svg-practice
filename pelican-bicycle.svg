<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8f0"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset="1" stop-color="#ffd93b"/>
    </radialGradient>
  </defs>

  <!-- sky & sun -->
  <rect x="0" y="0" width="900" height="650" fill="url(#sky)"/>
  <circle cx="760" cy="95" r="55" fill="url(#sun)"/>
  <ellipse cx="140" cy="90" rx="80" ry="26" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="330" cy="60" rx="55" ry="20" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="560" cy="120" rx="65" ry="22" fill="#ffffff" opacity="0.7"/>

  <!-- ground -->
  <rect x="0" y="520" width="900" height="130" fill="#82cd52"/>
  <path d="M0 520 Q 225 508 450 520 T 900 520" fill="none" stroke="#5aa030" stroke-width="4"/>
  <circle cx="90" cy="555" r="6" fill="#5aa030"/>
  <circle cx="700" cy="570" r="7" fill="#5aa030"/>
  <circle cx="820" cy="545" r="5" fill="#5aa030"/>

  <!-- ===== BICYCLE ===== -->
  <!-- wheels -->
  <g>
    <circle cx="250" cy="470" r="70" fill="#fdfdfd" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="250" cy="470" r="58" fill="none" stroke="#9a9a9a" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="250" y1="412" x2="250" y2="528"/>
      <line x1="192" y1="470" x2="308" y2="470"/>
      <line x1="209" y1="429" x2="291" y2="511"/>
      <line x1="291" y1="429" x2="209" y2="511"/>
      <line x1="226" y1="470" x2="274" y2="470"/>
      <line x1="250" y1="443" x2="250" y2="497"/>
    </g>
    <circle cx="250" cy="470" r="9" fill="#444"/>
  </g>
  <g>
    <circle cx="610" cy="470" r="70" fill="#fdfdfd" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="610" cy="470" r="58" fill="none" stroke="#9a9a9a" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="610" y1="412" x2="610" y2="528"/>
      <line x1="552" y1="470" x2="668" y2="470"/>
      <line x1="569" y1="429" x2="651" y2="511"/>
      <line x1="651" y1="429" x2="569" y2="511"/>
      <line x1="586" y1="470" x2="634" y2="470"/>
      <line x1="610" y1="443" x2="610" y2="497"/>
    </g>
    <circle cx="610" cy="470" r="9" fill="#444"/>
  </g>

  <!-- frame -->
  <g stroke="#e0492f" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="250" y1="470" x2="385" y2="350"/>   <!-- seat stays -->
    <line x1="385" y1="350" x2="525" y2="345"/>   <!-- top tube -->
    <line x1="525" y1="345" x2="610" y2="470"/>   <!-- down/chain stay to rear hub area -->
    <line x1="455" y1="470" x2="525" y2="345"/>   <!-- down tube -->
    <line x1="455" y1="470" x2="385" y2="350"/>   <!-- seat tube -->
    <line x1="455" y1="470" x2="610" y2="470"/>   <!-- chain stay -->
    <line x1="610" y1="470" x2="545" y2="330"/>   <!-- fork steerer -->
  </g>
  <!-- head tube -->
  <line x1="545" y1="330" x2="525" y2="345" stroke="#c93a24" stroke-width="14" stroke-linecap="round"/>
  <!-- handlebars -->
  <path d="M545 330 Q 535 300 560 292" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M560 292 Q 590 288 592 310" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- seat -->
  <line x1="385" y1="350" x2="380" y2="322" stroke="#333" stroke-width="8"/>
  <rect x="352" y="310" width="58" height="16" rx="8" fill="#1f1f1f"/>
  <!-- pedals -->
  <circle cx="455" cy="470" r="13" fill="#555"/>
  <g stroke="#555" stroke-width="7" stroke-linecap="round">
    <line x1="455" y1="470" x2="488" y2="503"/>
    <line x1="455" y1="470" x2="422" y2="437"/>
  </g>
  <rect x="476" y="498" width="28" height="11" rx="5" fill="#222"/>
  <rect x="410" y="432" width="28" height="11" rx="5" fill="#222"/>

  <!-- ===== PELICAN ===== -->
  <!-- legs to pedals -->
  <line x1="395" y1="335" x2="488" y2="503" stroke="#f2a83b" stroke-width="11" stroke-linecap="round"/>
  <line x1="415" y1="335" x2="422" y2="437" stroke="#f2a83b" stroke-width="11" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="492" cy="508" rx="17" ry="8" fill="#f2a83b"/>
  <ellipse cx="425" cy="440" rx="17" ry="8" fill="#f2a83b"/>

  <!-- tail -->
  <path d="M330 330 L 265 312 L 320 362 Z" fill="#ece7db" stroke="#cfc9bb" stroke-width="3"/>
  <path d="M335 345 L 278 345 L 330 375 Z" fill="#e2dccf" stroke="#cfc9bb" stroke-width="3"/>

  <!-- body -->
  <ellipse cx="395" cy="300" rx="82" ry="58" fill="#f7f3e8" stroke="#cfc9bb" stroke-width="3"/>

  <!-- wing -->
  <path d="M385 280 Q 340 320 410 360 Q 365 305 425 272 Z" fill="#e8e2d2" stroke="#c4bdae" stroke-width="3"/>
  <path d="M395 300 Q 375 330 405 345" fill="none" stroke="#c4bdae" stroke-width="2.5"/>

  <!-- neck -->
  <path d="M450 290 Q 492 262 500 205" stroke="#f7f3e8" stroke-width="34" fill="none" stroke-linecap="round"/>
  <path d="M450 290 Q 492 262 500 205" stroke="#cfc9bb" stroke-width="2" fill="none"/>

  <!-- head -->
  <circle cx="503" cy="185" r="24" fill="#f7f3e8" stroke="#cfc9bb" stroke-width="3"/>
  <!-- crest feathers -->
  <path d="M492 165 Q 485 145 470 140" fill="none" stroke="#f7f3e8" stroke-width="6" stroke-linecap="round"/>
  <path d="M500 162 Q 500 142 492 132" fill="none" stroke="#f7f3e8" stroke-width="6" stroke-linecap="round"/>
  <!-- eye -->
  <circle cx="512" cy="178" r="5" fill="#fff"/>
  <circle cx="513" cy="178" r="3" fill="#222"/>

  <!-- upper beak -->
  <path d="M524 182 L 620 190 L 524 198 Z" fill="#f5b942" stroke="#d18f1f" stroke-width="2.5"/>
  <!-- pouch -->
  <path d="M526 198 Q 585 255 615 196 Q 575 215 526 198 Z" fill="#f9d98a" stroke="#d18f1f" stroke-width="2.5"/>
  <!-- nostril line -->
  <path d="M545 190 L 585 193" stroke="#d18f1f" stroke-width="2" fill="none"/>

  <!-- arm reaching handlebar -->
  <path d="M445 300 Q 500 310 555 300" stroke="#f7f3e8" stroke-width="18" fill="none" stroke-linecap="round"/>
  <circle cx="558" cy="300" r="11" fill="#f7f3e8" stroke="#cfc9bb" stroke-width="2.5"/>

  <!-- motion lines -->
  <g stroke="#7fb3d5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="80" y1="380" x2="140" y2="380"/>
    <line x1="60" y1="420" x2="150" y2="420"/>
    <line x1="95" y1="460" x2="160" y2="460"/>
  </g>
</svg>
