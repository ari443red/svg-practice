<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d8f0"/>
      <stop offset="1" stop-color="#e8f6fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7ae"/>
      <stop offset="1" stop-color="#ffd93b"/>
    </radialGradient>
  </defs>

  <!-- sky & sun -->
  <rect x="0" y="0" width="900" height="650" fill="url(#sky)"/>
  <circle cx="760" cy="95" r="55" fill="url(#sun)"/>
  <ellipse cx="140" cy="90" rx="80" ry="26" fill="#ffffff" opacity="0.85"/>
  <ellipse cx="330" cy="60" rx="55" ry="20" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="560" cy="120" rx="65" ry="22" fill="#ffffff" opacity="0.7"/>

  <!-- ground -->
  <rect x="0" y="520" width="900" height="130" fill="#82cd52"/>
  <path d="M0 520 Q 225 508 450 520 T 900 520" fill="none" stroke="#5aa030" stroke-width="4"/>
  <circle cx="90" cy="555" r="6" fill="#5aa030"/>
  <circle cx="700" cy="570" r="7" fill="#5aa030"/>
  <circle cx="820" cy="545" r="5" fill="#5aa030"/>

  <!-- ===== BICYCLE ===== -->
  <g>
    <circle cx="250" cy="470" r="70" fill="#fdfdfd" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="250" cy="470" r="58" fill="none" stroke="#9a9a9a" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="250" y1="412" x2="250" y2="528"/>
      <line x1="192" y1="470" x2="308" y2="470"/>
      <line x1="209" y1="429" x2="291" y2="511"/>
      <line x1="291" y1="429" x2="209" y2="511"/>
    </g>
    <circle cx="250" cy="470" r="9" fill="#444"/>
  </g>
  <g>
    <circle cx="610" cy="470" r="70" fill="#fdfdfd" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="610" cy="470" r="58" fill="none" stroke="#9a9a9a" stroke-width="2"/>
    <g stroke="#a8a8a8" stroke-width="2">
      <line x1="610" y1="412" x2="610" y2="528"/>
      <line x1="552" y1="470" x2="668" y2="470"/>
      <line x1="569" y1="429" x2="651" y2="511"/>
      <line x1="651" y1="429" x2="569" y2="511"/>
    </g>
    <circle cx="610" cy="470" r="9" fill="#444"/>
  </g>

  <!-- frame -->
  <g stroke="#e0492f" stroke-width="11" stroke-linecap="round" fill="none">
    <line x1="250" y1="470" x2="385" y2="350"/>
    <line x1="385" y1="350" x2="525" y2="345"/>
    <line x1="525" y1="345" x2="610" y2="470"/>
    <line x1="455" y1="470" x2="525" y2="345"/>
    <line x1="455" y1="470" x2="385" y2="350"/>
    <line x1="455" y1="470" x2="610" y2="470"/>
    <line x1="610" y1="470" x2="545" y2="330"/>
  </g>
  <line x1="545" y1="330" x2="525" y2="345" stroke="#c93a24" stroke-width="14" stroke-linecap="round"/>
  <!-- handlebars -->
  <path d="M545 330 Q 535 300 560 292" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M560 292 Q 590 288 592 310" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- seat -->
  <line x1="385" y1="350" x2="380" y2="322" stroke="#333" stroke-width="8"/>
  <rect x="352" y="310" width="58" height="16" rx="8" fill="#1f1f1f"/>
  <!-- pedals -->
  <circle cx="455" cy="470" r="13" fill="#555"/>
  <g stroke="#555" stroke-width="7" stroke-linecap="round">
    <line x1="455" y1="470" x2="488" y2="503"/>
    <line x1="455" y1="470" x2="422" y2="437"/>
  </g>
  <rect x="476" y="498" width="28" height="11" rx="5" fill="#222"/>
  <rect x="410" y="432" width="28" height="11" rx="5" fill="#222"/>

  <!-- ===== CAT ===== -->
  <!-- tail curling up behind -->
  <path d="M320 320 Q 260 300 250 240 Q 248 210 275 205" fill="none" stroke="#f5a623" stroke-width="14" stroke-linecap="round"/>
  <path d="M275 205 Q 285 200 292 210" fill="none" stroke="#f5a623" stroke-width="14" stroke-linecap="round"/>

  <!-- legs to pedals -->
  <line x1="395" y1="335" x2="488" y2="503" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <line x1="415" y1="335" x2="422" y2="437" stroke="#f5a623" stroke-width="11" stroke-linecap="round"/>
  <!-- paws on pedals -->
  <ellipse cx="492" cy="508" rx="17" ry="9" fill="#f7b955"/>
  <ellipse cx="425" cy="440" rx="17" ry="9" fill="#f7b955"/>

  <!-- body -->
  <ellipse cx="395" cy="295" rx="85" ry="58" fill="#f7b955" stroke="#d98d1f" stroke-width="3"/>
  <!-- stripes -->
  <g stroke="#d98d1f" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M345 265 Q 355 275 350 295"/>
    <path d="M360 255 Q 370 270 365 292"/>
    <path d="M420 255 Q 410 270 415 292"/>
    <path d="M440 265 Q 432 278 438 296"/>
  </g>
  <!-- belly patch -->
  <ellipse cx="395" cy="320" rx="45" ry="30" fill="#fde3b8" opacity="0.8"/>

  <!-- front legs / arm to handlebar -->
  <path d="M445 295 Q 500 308 555 300" stroke="#f7b955" stroke-width="17" fill="none" stroke-linecap="round"/>
  <circle cx="558" cy="300" r="11" fill="#f7b955" stroke="#d98d1f" stroke-width="2.5"/>

  <!-- neck -->
  <path d="M455 275 Q 490 250 498 205" stroke="#f7b955" stroke-width="32" fill="none" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="500" cy="180" r="26" fill="#f7b955" stroke="#d98d1f" stroke-width="3"/>
  <!-- ears -->
  <path d="M482 162 L 472 128 L 500 148 Z" fill="#f7b955" stroke="#d98d1f" stroke-width="3"/>
  <path d="M518 162 L 528 128 L 500 148 Z" fill="#f7b955" stroke="#d98d1f" stroke-width="3"/>
  <path d="M484 156 L 479 138 L 494 148 Z" fill="#f9c4d4"/>
  <path d="M516 156 L 521 138 L 506 148 Z" fill="#f9c4d4"/>
  <!-- head stripes -->
  <path d="M492 158 L 494 148" stroke="#d98d1f" stroke-width="3" stroke-linecap="round"/>
  <path d="M500 156 L 500 146" stroke="#d98d1f" stroke-width="3" stroke-linecap="round"/>
  <path d="M508 158 L 506 148" stroke="#d98d1f" stroke-width="3" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="490" cy="176" rx="7" ry="8" fill="#ffffff"/>
  <ellipse cx="510" cy="176" rx="7" ry="8" fill="#ffffff"/>
  <ellipse cx="491" cy="177" rx="4" ry="5" fill="#3a9b3a"/>
  <ellipse cx="511" cy="177" rx="4" ry="5" fill="#3a9b3a"/>
  <ellipse cx="491" cy="177" rx="1.8" ry="3.5" fill="#111"/>
  <ellipse cx="511" cy="177" rx="1.8" ry="3.5" fill="#111"/>
  <!-- nose & mouth -->
  <path d="M496 188 L 504 188 L 500 194 Z" fill="#e86a8a"/>
  <path d="M500 194 Q 495 200 488 197 M500 194 Q 505 200 512 197" fill="none" stroke="#b06010" stroke-width="2"/>
  <!-- whiskers -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="480" y1="186" x2="452" y2="180"/>
    <line x1="480" y1="192" x2="454" y2="194"/>
    <line x1="520" y1="186" x2="548" y2="180"/>
    <line x1="520" y1="192" x2="546" y2="194"/>
  </g>

  <!-- motion lines -->
  <g stroke="#7fb3d5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="80" y1="380" x2="140" y2="380"/>
    <line x1="60" y1="420" x2="150" y2="420"/>
    <line x1="95" y1="460" x2="160" y2="460"/>
  </g>
</svg>
